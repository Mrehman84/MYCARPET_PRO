<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPET PRO v2.0</title>
    <!-- Kita tukar guna Bootstrap CSS supaya hiasan butang dijamin 100% keluar walaupun internet perlahan -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <!-- Pembantu Ikon Bootstrap -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 90px; }
        .header-utama { background-color: #0d6efd; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .kotak-kandungan { background: white; padding: 20px; border-radius: 15px; box-shadow: 0px 4px 6px rgba(0,0,0,0.05); margin-top: 15px; }
        .menu-bawah { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #dee2e6; padding: 10px 0; box-shadow: 0px -4px 10px rgba(0,0,0,0.05); z-index: 1000; }
        .butang-menu { flex: 1; border: none; background: none; color: #6c757d; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; }
        .butang-menu i { font-size: 20px; margin-bottom: 2px; }
        .butang-active { color: #0d6efd !important; }
    </style>
</head>
<body>

    <!-- BAHAGIAN ATAS -->
    <div class="header-utama">
        <h1 style="font-size: 20px; margin: 0;">✨ MYCARPET PRO v2.0</h1>
        <small style="opacity: 0.8;">Sistem Pengurusan Cucian Karpet</small>
    </div>

    <!-- BAHAGIAN UTAMA -->
    <div class="container" style="max-width: 450px;">
        <div id="kandungan-sistem" class="kotak-kandungan">
            <h3 style="font-size: 18px; color: #333;">👋 Selamat Datang!</h3>
            <p style="font-size: 14px; color: #666;">Sila pilih menu di bawah untuk memulakan tugasan cuci karpet hari ini.</p>
        </div>
    </div>

    <!-- BAHAGIAN BAWAH: Menu Butang Besar Mesra Phone (Gerenti Cantik!) -->
    <div class="menu-bawah">
        <div class="d-flex justify-content-around mx-auto" style="max-width: 450px;">
            
            <button onclick="tukarMenu('tempahan', this)" class="butang-menu butang-active">
                <i class="bi bi-file-earmark-plus-fill"></i>
                <span>Tempahan</span>
            </button>

            <button onclick="tukarMenu('invois', this)" class="butang-menu">
                <i class="bi bi-printer-fill"></i>
                <span>Cetak Invois</span>
            </button>

            <button onclick="tukarMenu('harga', this)" class="butang-menu">
                <i class="bi bi-tags-fill"></i>
                <span>Katalog</span>
            </button>

            <button onclick="tukarMenu('kewangan', this)" class="butang-menu">
                <i class="bi bi-wallet2"></i>
                <span>Kewangan</span>
            </button>

        </div>
    </div>

    <script>
        function tukarMenu(namaMenu, butangDitekan) {
            // 1. Tukar warna butang yang aktif
            let semuaButang = document.querySelectorAll('.butang-menu');
            semuaButang.forEach(b => b.classList.remove('butang-active'));
            butangDitekan.classList.add('butang-active');

            // 2. Tukar kandungan skrin
            let kawasanKandungan = document.getElementById('kandungan-sistem');
            
            if (namaMenu === 'tempahan') {
                kawasanKandungan.innerHTML = `
                    <h4 class="text-primary mb-3"><i class="bi bi-file-earmark-plus-fill me-2"></i>Tempahan Baru</h4>
                    <p class="small text-muted">Isi borang di bawah untuk masuk data ke Google Sheets.</p>
                    <div class="p-4 text-center border border-dashed rounded text-muted small bg-light">Borang Tempahan Karpet</div>
                `;
            } else if (namaMenu === 'invois') {
                kawasanKandungan.innerHTML = `
                    <h4 class="text-purple mb-3" style="color: #6f42c1;"><i class="bi bi-printer-fill me-2"></i>Cetak Invois & Resit</h4>
                    <p class="small text-muted mb-2">Sila pilih nama pelanggan:</p>
                    <select id="pilih-pelanggan" class="form-select form-select-md mb-3 bg-light">
                        <option>🔄 Sedang memuatkan nama pelanggan...</option>
                    </select>
                `;
                
                // Ambil data dari API Python
                fetch('/api/pelanggan')
                    .then(res => res.json())
                    .then(hasil => {
                        let kotakPilihan = document.getElementById('pilih-pelanggan');
                        kotakPilihan.innerHTML = '';
                        if (hasil.status === 'berjaya') {
                            if (hasil.data.length === 0) {
                                kotakPilihan.innerHTML = '<option>Tiada rekod pelanggan</option>';
                            } else {
                                hasil.data.forEach(nama => {
                                    let opt = document.createElement('option');
                                    opt.value = nama;
                                    opt.textContent = nama;
                                    kotakPilihan.appendChild(opt);
                                });
                            }
                        } else {
                            kotakPilihan.innerHTML = `<option>❌ Ralat: ${hasil.mesej}</option>`;
                        }
                    })
                    .catch(err => {
                        document.getElementById('pilih-pelanggan').innerHTML = `<option>❌ Gagal bersambung ke backend</option>`;
                    });
                    
            } else if (namaMenu === 'harga') {
                kawasanKandungan.innerHTML = `
                    <h4 class="text-success mb-3"><i class="bi bi-tags-fill me-2"></i>Katalog Harga</h4>
                    <p class="small text-muted">Senarai harga cucian mengikut saiz karpet.</p>
                `;
            } else if (namaMenu === 'kewangan') {
                kawasanKandungan.innerHTML = `
                    <h4 class="text-warning mb-3"><i class="bi bi-wallet2 me-2"></i>Laporan Kewangan</h4>
                    <p class="small text-muted">Ringkasan untung rugi kedai karpet kamu.</p>
                `;
            }
        }
    </script>
</body>
</html>
