<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCARPET PRO v2.0</title>
    <!-- Kita guna Tailwind CSS supaya butang jadi cantik automatik -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- BAHAGIAN ATAS: Tajuk Utama -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">✨ MYCARPET PRO v2.0</h1>
        <p class="text-xs opacity-90">Sistem Pengurusan Cucian Karpet</p>
    </header>

    <!-- BAHAGIAN UTAMA: Tempat Paparan Borang/Invois -->
    <main class="max-w-md mx-auto p-4 mt-2">
        <!-- Kotak Kandungan yang akan bertukar mengikut butang yang ditekan -->
        <div id="kandungan-sistem" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-700 mb-2">👋 Selamat Datang!</h2>
            <p class="text-sm text-gray-500">Sila pilih menu di bawah untuk memulakan tugasan cuci karpet hari ini.</p>
        </div>
    </main>

    <!-- BAHAGIAN BAWAH: Menu Butang Grid Besar (Sangat Mesra Phone!) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-xl px-2 py-2 z-50">
        <div class="grid grid-cols-4 gap-1 max-w-md mx-auto">
            
            <!-- Butang 1: Tempahan -->
            <button onclick="tukarMenu('tempahan')" class="flex flex-col items-center justify-center p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition">
                <i class="fa-solid fa-file-invoice text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Tempahan</span>
            </button>

            <!-- Butang 2: Cetak Invois -->
            <button onclick="tukarMenu('invois')" class="flex flex-col items-center justify-center p-2 text-gray-500 hover:bg-blue-50 rounded-xl transition">
                <i class="fa-solid fa-print text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Cetak Invois</span>
            </button>

            <!-- Butang 3: Katalog Harga -->
            <button onclick="tukarMenu('harga')" class="flex flex-col items-center justify-center p-2 text-gray-500 hover:bg-blue-50 rounded-xl transition">
                <i class="fa-solid fa-tags text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Katalog</span>
            </button>

            <!-- Butang 4: Kewangan -->
            <button onclick="tukarMenu('kewangan')" class="flex flex-col items-center justify-center p-2 text-gray-500 hover:bg-blue-50 rounded-xl transition">
                <i class="fa-solid fa-wallet text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Kewangan</span>
            </button>

        </div>
    </nav>

    <!-- SKRIPT: Logik Tukar Menu & Tarik Data API Python -->
    <script>
        function tukarMenu(namaMenu) {
            let kawasanKandungan = document.getElementById('kandungan-sistem');
            
            if (namaMenu === 'tempahan') {
                kawasanKandungan.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-blue-600"><i class="fa-solid fa-file-invoice mr-2"></i>Tempahan Baru</h2>
                    <p class="text-sm text-gray-600 mb-4">Isi borang di bawah untuk masuk data ke Google Sheets.</p>
                    <div class="text-xs text-center p-4 bg-gray-50 border border-dashed rounded-xl">Borang Tempahan Karpet</div>
                `;
            } else if (namaMenu === 'invois') {
                // 1. Tunjukkan rupa bentuk kotak pilihan dahulu sementara memuatkan data
                kawasanKandungan.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-purple-600"><i class="fa-solid fa-print mr-2"></i>Cetak Invois & Resit</h2>
                    <p class="text-sm text-gray-600 mb-4">Sila pilih nama pelanggan:</p>
                    <select id="pilih-pelanggan" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-4">
                        <option>🔄 Sedang memuatkan nama pelanggan...</option>
                    </select>
                `;
                
                // 2. Panggil API Python untuk ambil data dari Google Sheets secara langsung
                fetch('/api/pelanggan')
                    .then(response => response.json())
                    .then(hasil => {
                        let kotakPilihan = document.getElementById('pilih-pelanggan');
                        kotakPilihan.innerHTML = ''; // Kosongkan tulisan "memuatkan"
                        
                        if (hasil.status === 'berjaya') {
                            if (hasil.data.length === 0) {
                                kotakPilihan.innerHTML = '<option>Tiada rekod pelanggan dijumpai</option>';
                            } else {
                                // Masukkan setiap nama pelanggan ke dalam kotak pilihan phone
                                hasil.data.forEach(nama => {
                                    let pilihanBaru = document.createElement('option');
                                    pilihanBaru.value = nama;
                                    pilihanBaru.textContent = nama;
                                    kotakPilihan.appendChild(pilihanBaru);
                                });
                            }
                        } else {
                            kotakPilihan.innerHTML = `<option>❌ Ralat: ${hasil.mesej}</option>`;
                        }
                    })
                    .catch(error => {
                        document.getElementById('pilih-pelanggan').innerHTML = `<option>❌ Gagal bersambung ke pelayan backend</option>`;
                    });
                    
            } else if (namaMenu === 'harga') {
                kawasanKandungan.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-green-600"><i class="fa-solid fa-tags mr-2"></i>Katalog Harga</h2>
                    <p class="text-sm text-gray-600">Senarai harga cucian mengikut saiz karpet.</p>
                `;
            } else if (namaMenu === 'kewangan') {
                kawasanKandungan.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-amber-600"><i class="fa-solid fa-wallet mr-2"></i>Laporan Kewangan</h2>
                    <p class="text-sm text-gray-600">Ringkasan untung rugi kedai karpet kamu.</p>
                `;
            }
        }
    </script>
</body>
</html>
